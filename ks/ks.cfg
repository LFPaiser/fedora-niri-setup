# Fedora 44 + niri — unattended install for VirtualBox
# Picked up automatically by Anaconda because this volume is labeled OEMDRV.

text
reboot --eject

url --mirrorlist="https://mirrors.fedoraproject.org/mirrorlist?repo=fedora-44&arch=x86_64"
repo --name=updates --mirrorlist="https://mirrors.fedoraproject.org/mirrorlist?repo=updates-released-f44&arch=x86_64"

# Neutral defaults: change language, keyboard layout and time zone to yours
# (e.g. lang de_DE.UTF-8, keyboard --vckeymap=de --xlayouts='de', timezone Europe/Berlin).
lang en_US.UTF-8
keyboard --vckeymap=us --xlayouts='us'
timezone Etc/UTC --utc
network --bootproto=dhcp --device=link --activate --hostname=fedora-niri

firstboot --disable
selinux --enforcing
firewall --enabled --service=ssh

zerombr
clearpart --all --initlabel --disklabel=gpt
autopart --type=btrfs
bootloader --timeout=3

rootpw --lock
# Login user. To use another name, change it here AND in KS_USER in %post below.
user --name=user --gecos="User" --groups=wheel --password=changeme --plaintext
# Optional: key-based SSH into the VM. Create a key with
#   ssh-keygen -t ed25519 -f vm_ed25519
# then uncomment this line and paste the contents of vm_ed25519.pub.
# sshkey --username=user "ssh-ed25519 AAAA... fedora-niri-vm"

services --enabled=sshd,gdm,NetworkManager
xconfig --startxonboot

%packages --ignoremissing
@core
@standard
@hardware-support
@fonts
@networkmanager-submodules
@multimedia

# Compositor + login
niri
xwayland-satellite
gdm

# Desktop pieces niri's default config expects
waybar
fuzzel
alacritty
mako
gtklock
swayidle
swaybg
xdg-desktop-portal-gnome
xdg-desktop-portal-gtk
gnome-keyring
mate-polkit

# Audio / network / tray
pipewire
pipewire-pulseaudio
wireplumber
pavucontrol
network-manager-applet
NetworkManager-tui
blueman

# Utilities
wl-clipboard
grim
slurp
brightnessctl
playerctl
firefox
nautilus
gnome-text-editor
loupe
file-roller
flatpak
git
vim-enhanced
htop
fastfetch

# Fonts
google-noto-sans-fonts
google-noto-emoji-fonts
fontawesome-fonts-all
jetbrains-mono-fonts-all

# VirtualBox guest integration (only useful in the VM)
virtualbox-guest-additions
%end

%post --log=/root/ks-post.log
systemctl set-default graphical.target

# Must match --name in the "user" line above.
KS_USER=user
# xkb layout(s) for niri, e.g. "us" or "de,us".
KS_XKB_LAYOUT=us

# Make niri the default session in GDM for the user
mkdir -p /var/lib/AccountsService/users
cat > "/var/lib/AccountsService/users/$KS_USER" <<'EOF'
[User]
Session=niri
SystemAccount=false
EOF

# niri config for the user: upstream default with the chosen keyboard layout
NIRI_DEFAULT=$(rpm -ql niri | grep -m1 'default-config.kdl$')
KS_HOME=/home/$KS_USER
if [ -n "$NIRI_DEFAULT" ]; then
  install -d -o "$KS_USER" -g "$KS_USER" "$KS_HOME/.config" "$KS_HOME/.config/niri"
  sed -e "s|^\(\s*\)// layout \"us,ru\"|\1layout \"$KS_XKB_LAYOUT\"|" "$NIRI_DEFAULT" > "$KS_HOME/.config/niri/config.kdl"
  chown "$KS_USER:$KS_USER" "$KS_HOME/.config/niri/config.kdl"
  restorecon -R "$KS_HOME/.config"
fi

# Flathub for apps not in Fedora repos
flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo || true
%end

# Volume groups: Media, Notifications, System and Calls. Each is a virtual output
# (loopback) with its own volume, in front of the real output, whose volume stays the
# master. WirePlumber's role-based linking sends each stream to the group whose
# device.intended-roles include its media.role; streams with no role count as Media
# (wireplumber.conf.d/60-volume-groups.conf). Per-app volume still works on top (wiremix).
#
#   wpctl status                   the groups show up as sinks: Media, Notifications, ...
#   ~/.local/bin/vol-group media +5   change a group's volume (also -5, mute)

context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Media"
      capture.props = {
        node.name = "group.media"
        media.class = "Audio/Sink"
        audio.position = [ FL FR ]
        device.intended-roles = [ "Multimedia", "Music", "Movie", "Game", "Production" ]
        policy.role-based.priority = 10
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "mix"
        priority.session = 0
        priority.driver = 0
      }
      playback.props = {
        node.name = "group.media.out"
        node.passive = true
        media.role = "Loopback"
      }
    }
  }
  { name = libpipewire-module-loopback
    args = {
      node.description = "Notifications"
      capture.props = {
        node.name = "group.notifications"
        media.class = "Audio/Sink"
        audio.position = [ FL FR ]
        device.intended-roles = [ "Notification" ]
        policy.role-based.priority = 20
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "mix"
        priority.session = 0
        priority.driver = 0
      }
      playback.props = {
        node.name = "group.notifications.out"
        node.passive = true
        media.role = "Loopback"
      }
    }
  }
  { name = libpipewire-module-loopback
    args = {
      node.description = "System"
      capture.props = {
        node.name = "group.system"
        media.class = "Audio/Sink"
        audio.position = [ FL FR ]
        device.intended-roles = [ "Event", "Alert", "Accessibility", "Assistant" ]
        policy.role-based.priority = 30
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "mix"
        priority.session = 0
        priority.driver = 0
      }
      playback.props = {
        node.name = "group.system.out"
        node.passive = true
        media.role = "Loopback"
      }
    }
  }
  { name = libpipewire-module-loopback
    args = {
      node.description = "Calls"
      capture.props = {
        node.name = "group.calls"
        media.class = "Audio/Sink"
        audio.position = [ FL FR ]
        device.intended-roles = [ "Communication", "Phone" ]
        policy.role-based.priority = 40
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "mix"
        priority.session = 0
        priority.driver = 0
      }
      playback.props = {
        node.name = "group.calls.out"
        node.passive = true
        media.role = "Loopback"
      }
    }
  }
]

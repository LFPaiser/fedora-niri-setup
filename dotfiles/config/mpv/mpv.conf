# Video player. The uosc interface replaces the stock controls.
vo=gpu-next
hwdec=auto-safe
keep-open=yes
save-position-on-quit=yes
osc=no
osd-bar=no
border=no
sub-auto=fuzzy
# Preferred subtitle languages, in order (e.g. de,deu,en,eng)
slang=en,eng
screenshot-directory=~/Pictures/Screenshots
ytdl-format=bestvideo[height<=?1080]+bestaudio/best

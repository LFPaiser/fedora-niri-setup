# Starship prompt in Umbra: two lines with rounded blocks.
#   line 1: [folder][git branch + status][project language] ......... [slow cmd time][clock]
#   line 2: ❯   (amber; red when the last command failed)
# Icons are Nerd Font code points written as \u escapes (JetBrainsMono Nerd Font).
# git status: !n changed · +n staged · ?n new · ⇡n to push · ⇣n to pull · $n stashed
format = """
[](amber)$username$directory[](fg:amber bg:block)$git_branch$git_state$git_status[](fg:block bg:block2)$nodejs$python$golang$rust[](fg:block2)$fill$cmd_duration$time
$character"""
add_newline = true
palette = "umbra"

[palettes.umbra]
amber = "#e0a050"
lilac = "#c58bd6"
pink = "#f0a6c8"
green = "#a8c98a"
yellow = "#f2cf8a"
red = "#e5455a"
dim = "#8f6a90"
cream = "#fdf0dc"
crust = "#14031a"
block = "#57235a"
block2 = "#3a1544"

# only shown as root or over ssh
[username]
style_user = "bold fg:crust bg:amber"
style_root = "bold fg:cream bg:red"
format = "[ $user ]($style)"

[directory]
style = "bold fg:crust bg:amber"
read_only = " "
read_only_style = "fg:crust bg:amber"
truncation_length = 3
truncate_to_repo = false
truncation_symbol = "…/"
format = "[ $path]($style)[$read_only]($read_only_style)[ ]($style)"

[git_branch]
symbol = ""
style = "fg:cream bg:block"
format = "[ $symbol $branch ]($style)"

[git_state]
style = "bold fg:yellow bg:block"
format = "[$state( $progress_current/$progress_total) ]($style)"

[git_status]
style = "fg:pink bg:block"
format = "[($all_status$ahead_behind )]($style)"
modified = "!${count}"
staged = "+${count}"
untracked = "?${count}"
deleted = "✘${count}"
renamed = "»${count}"
conflicted = "=${count}"
stashed = "\\$${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

[nodejs]
symbol = ""
style = "fg:green bg:block2"
format = "[ $symbol $version ]($style)"

[python]
symbol = ""
style = "fg:yellow bg:block2"
format = "[ $symbol $version( \\($virtualenv\\)) ]($style)"

[golang]
symbol = ""
style = "fg:lilac bg:block2"
format = "[ $symbol $version ]($style)"

[rust]
symbol = ""
style = "fg:pink bg:block2"
format = "[ $symbol $version ]($style)"

[fill]
symbol = " "

[cmd_duration]
min_time = 2000
style = "yellow"
format = "[ $duration]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "dim"
format = "[ $time]($style)"

[character]
success_symbol = "[❯](bold amber)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold lilac)"

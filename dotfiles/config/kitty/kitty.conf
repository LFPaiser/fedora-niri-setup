# Fallback terminal (Super+Alt+Enter); Ghostty is the main one. Same look and split
# keys as Ghostty, and the same image protocol, so yazi previews and icat still work.
# Umbra colors (from wallpaper).

font_family      JetBrainsMono Nerd Font
font_size        11
modify_font      cell_height 8%

window_padding_width 10 12
hide_window_decorations yes
background_opacity 0.94
confirm_os_window_close 0
enable_audio_bell no

cursor_shape beam
cursor_blink_interval 0.5
mouse_hide_wait 0
copy_on_select clipboard
scrollback_lines 10000
shell_integration no-cursor
update_check_interval 0

# Splits like Ghostty: Ctrl+Shift+Enter splits, Ctrl+Shift+H/J/K/L moves,
# Ctrl+Shift+Alt+H/J/K/L resizes, Ctrl+Shift+Z zooms.
enabled_layouts splits, stack
inactive_text_alpha 0.6
map ctrl+shift+enter       launch --location=split --cwd=current
map ctrl+shift+h           neighboring_window left
map ctrl+shift+l           neighboring_window right
map ctrl+shift+k           neighboring_window up
map ctrl+shift+j           neighboring_window down
map ctrl+shift+z           toggle_layout stack
map ctrl+shift+alt+h       resize_window narrower 4
map ctrl+shift+alt+l       resize_window wider 4
map ctrl+shift+alt+k       resize_window taller 2
map ctrl+shift+alt+j       resize_window shorter 2


# Fallback terminal (Ghostty is the main one). Umbra (from wallpaper).
[window]
padding = { x = 12, y = 10 }
dynamic_padding = true
opacity = 0.94

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
size = 11

[colors.primary]
background = "#26082f"
foreground = "#fdf0dc"

[colors.cursor]
text = "#26082f"
cursor = "#fdf0dc"

[colors.selection]
text = "#26082f"
background = "#fdf0dc"

[colors.normal]
black = "#57235a"
red = "#e86a7a"
green = "#a8c98a"
yellow = "#f2cf8a"
blue = "#c58bd6"
magenta = "#f0a6c8"
cyan = "#8fcfc0"
white = "#e6d6c6"

[colors.bright]
black = "#6a3a6e"
red = "#e86a7a"
green = "#a8c98a"
yellow = "#f2cf8a"
blue = "#c58bd6"
magenta = "#f0a6c8"
cyan = "#8fcfc0"
white = "#d9c4b8"

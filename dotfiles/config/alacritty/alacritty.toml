# Fallback terminal (Ghostty is the main one). Umbra (from wallpaper).
[window]
padding = { x = 12, y = 10 }
dynamic_padding = true
opacity = 0.94

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
size = 11

[colors.primary]
background = "#26082f"
foreground = "#fdf0dc"

[colors.cursor]
text = "#26082f"
cursor = "#e0a050"

[colors.selection]
text = "#fdf0dc"
background = "#57235a"

[colors.normal]
black = "#3a1544"
red = "#e86a7a"
green = "#a8c98a"
yellow = "#f2cf8a"
blue = "#c58bd6"
magenta = "#f0a6c8"
cyan = "#8fcfc0"
white = "#e6d6c6"

[colors.bright]
black = "#6a3a6e"
red = "#f0889a"
green = "#bcdb9e"
yellow = "#f7dca6"
blue = "#d6a6e4"
magenta = "#f6bcd8"
cyan = "#a6dcd0"
white = "#fdf0dc"

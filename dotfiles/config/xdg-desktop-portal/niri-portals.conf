# Which portal backend handles each request in a niri session. Overrides
# /usr/share/xdg-desktop-portal/niri-portals.conf (same lines, plus FileChooser).
# FileChooser = gtk: Open/Save dialogs use the classic GTK chooser (same as on
# Cinnamon next to Nemo) instead of the Nautilus one from the gnome portal.
# Nemo has no portal of its own, so it can't be the picker.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.FileChooser=gtk;

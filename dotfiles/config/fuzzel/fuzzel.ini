# App launcher (Super+Space). Umbra (from wallpaper).
[main]
font=Inter:size=12
prompt="  "
icon-theme=Papirus-Dark-Umbra
terminal=ghostty -e
layer=overlay
width=40
lines=10
horizontal-pad=20
vertical-pad=14
inner-pad=8
line-height=24

[colors]
background=26082ff0
text=fdf0dcff
prompt=e0a050ff
placeholder=8f6a90ff
input=fdf0dcff
match=e0a050ff
selection=57235aff
selection-text=fdf0dcff
selection-match=f2cf8aff
counter=8f6a90ff
border=e0a050ff

[border]
width=2
radius=12

# Clipboard history (Super+Shift+V) reads these as exit codes 10 and 11.
# Shift+Delete was "expunge" (forget an app in the launcher's recent list).
[key-bindings]
expunge=none
custom-1=Shift+Delete
custom-2=Control+Shift+Delete

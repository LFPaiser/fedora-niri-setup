# App launcher (Super+Space). Catppuccin Mocha.
[main]
font=Inter:size=12
prompt="  "
icon-theme=Papirus-Dark
terminal=ghostty -e
layer=overlay
width=40
lines=10
horizontal-pad=20
vertical-pad=14
inner-pad=8
line-height=24

[colors]

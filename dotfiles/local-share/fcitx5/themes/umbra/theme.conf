# Umbra theme for the fcitx5 candidate window: the same card as the
# notifications (base at 94%, amber border, rounded), selection in surface1.
[Metadata]
Name=Umbra
Version=1
Author=fedora-niri-setup
Description=Umbra (roxo escuro, borda âmbar)
ScaleWithDPI=True

[InputPanel]
# candidates / selected candidate / preedit text and its highlight
NormalColor=#d9c4b8
HighlightCandidateColor=#fdf0dc
HighlightColor=#14031a
HighlightBackgroundColor=#e0a050
PageButtonAlignment=Last Candidate

[InputPanel/TextMargin]
Left=7
Right=7
Top=5
Bottom=5

[InputPanel/ContentMargin]
Left=8
Right=8
Top=7
Bottom=7

[InputPanel/Background]
Image=panel.svg

[InputPanel/Background/Margin]
Left=12
Right=12
Top=12
Bottom=12

[InputPanel/Highlight]
Image=highlight.svg

[InputPanel/Highlight/Margin]
Left=6
Right=6
Top=6
Bottom=6

[InputPanel/Highlight/HighlightClickMargin]
Left=0
Right=0
Top=0
Bottom=0

[InputPanel/PrevPage]
Image=prev.svg

[InputPanel/PrevPage/ClickMargin]
Left=6
Right=6
Top=4
Bottom=4

[InputPanel/NextPage]
Image=next.svg

[InputPanel/NextPage/ClickMargin]
Left=6
Right=6
Top=4
Bottom=4

[Menu]
NormalColor=#d9c4b8
HighlightCandidateColor=#fdf0dc

[Menu/Background]
Image=menu.svg

[Menu/Background/Margin]
Left=8
Right=8
Top=8
Bottom=8

[Menu/ContentMargin]
Left=4
Right=4
Top=5
Bottom=5

[Menu/Highlight]
Image=highlight.svg

[Menu/Highlight/Margin]
Left=6
Right=6
Top=6
Bottom=6

[Menu/Separator]
Color=#3a1544

[Menu/CheckBox]
Image=radio.svg

[Menu/SubMenu]
Image=arrow.svg

[Menu/TextMargin]
Left=7
Right=7
Top=5
Bottom=5
